name: ci
on: [push, pull_request]
jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pipeline self-check (pure logic, no API/ffmpeg)
        run: python pipeline.py
      - name: Provenance self-check (fingerprint + CID + NFT metadata)
        run: python provenance.py
      - name: Token-gate self-check (X Layer balanceOf, mocked RPC)
        run: python tokengate.py
      - name: Install deps + ffmpeg
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Import server
        run: python -c "import server; print('server imports ok')"
      - name: x402 payment-gate test (pure)
        run: python test_x402.py
      - name: Integration test (real ffmpeg, stubbed Venice — no API key)
        run: python test_render.py

  docker:
    # The container is a recommended deploy path but was never built in CI, so two
    # Dockerfile breaks (missing modules, an inline COPY comment) shipped unnoticed.
    # Build it here so a broken Dockerfile fails CI instead of the deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build (catches Dockerfile breakage)
        run: docker build -t dalang:ci .
      - name: container boots + imports all runtime modules
        run: docker run --rm dalang:ci python -c "import server; print('container ok')"
